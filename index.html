<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажёр | Строгий режим + Страйки</title>
    <!-- Салют -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #2c3e50; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); position: relative; }
        h1, h2, h3 { text-align: center; color: #1a252f; }
        
        /* Личный кабинет */
        .cabinet { background: #eaf2f8; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border: 2px solid #3498db; }
        .user-info { font-size: 18px; font-weight: bold; }
        .xp-badge { background: #f1c40f; color: #8e44ad; padding: 8px 15px; border-radius: 20px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* МОТИВАЦИЯ (Теперь только при поражении) */
        .motivation-banner { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); padding: 15px 20px; border-radius: 10px; font-style: italic; font-weight: bold; font-size: 17px; color: #b71540; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        .login-screen { text-align: center; padding: 40px 0; }
        .name-input { padding: 12px; font-size: 18px; border: 2px solid #bdc3c7; border-radius: 8px; width: 60%; margin-bottom: 20px; }
        
        /* Кнопки */
        .btn { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: all 0.2s; }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover { background-color: #2980b9; transform: translateY(-2px); }
        .btn-back { background-color: #7f8c8d; color: white; position: absolute; top: 20px; left: 20px; padding: 8px 15px; font-size: 14px; }
        .btn-back:hover { background-color: #95a5a6; }
        .btn-rulebook { background-color: #9b59b6; color: white; display: block; width: 100%; margin-bottom: 20px; font-size: 18px; }
        .btn-rulebook:hover { background-color: #8e44ad; transform: translateY(-2px); }
        .btn-hint { background-color: #f39c12; color: white; padding: 8px 15px; font-size: 14px; margin-bottom: 15px; display: inline-block; }

        /* Вкладки предметов */
        .subject-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 15px 30px; font-size: 18px; font-weight: bold; background-color: #ecf0f1; border: 2px solid #bdc3c7; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background-color: #3498db; color: white; border-color: #2980b9; }

        /* Меню тем */
        .topics-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 30px;}
        .topic-btn { padding: 15px; background-color: #2ecc71; color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 15px; font-weight: 600; text-align: left; box-shadow: 0 4px 6px rgba(46, 204, 113, 0.2); transition: all 0.2s; }
        .topic-btn:hover { background-color: #27ae60; transform: translateY(-2px); }
        
        /* Справочник (карточки правил) */
        .rule-card { background: #f9fbfd; padding: 20px; border-left: 6px solid #3498db; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); font-size: 16px; line-height: 1.6; }
        .rule-card h3 { margin-top: 0; color: #2980b9; text-align: left; }

        .quiz-container, #menu-container, #rulebook-container { display: none; }
        
        /* Квиз */
        .header-quiz { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; margin-bottom: 20px; }
        .progress { font-weight: bold; color: #3498db; background: #ebf5fb; padding: 5px 12px; border-radius: 20px; margin-left: 15px; }
        
        /* Индикатор страйка */
        .streak-indicator { font-weight: bold; color: #e67e22; background: #fdebd0; padding: 5px 12px; border-radius: 20px; display: none; }
        
        .question { font-size: 22px; margin-bottom: 20px; font-weight: 600; }
        .hint-text { display: none; background: #fff3cd; color: #856404; padding: 12px; border-left: 4px solid #ffeeba; border-radius: 4px; margin-bottom: 20px; font-style: italic; }
        .options { display: grid; gap: 12px; }
        .option-btn { padding: 16px 20px; background-color: #f8f9f9; border: 2px solid #bdc3c7; border-radius: 10px; cursor: pointer; text-align: left; font-size: 16px; transition: all 0.2s; }
        .option-btn:hover:not(:disabled) { background-color: #ecf0f1; border-color: #95a5a6; }
        
        @keyframes popPulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25%, 75% { transform: translateX(-5px); } 50% { transform: translateX(5px); } }

        .correct { background-color: #e8f8f5 !important; border-color: #2ecc71 !important; color: #27ae60; animation: popPulse 0.4s ease-in-out; }
        .wrong { background-color: #fdedec !important; border-color: #e74c3c !important; color: #c0392b; animation: shake 0.4s ease-in-out; }
        .next-btn { display: none; margin-top: 25px; width: 100%; background-color: #8e44ad; color: white; }
        .next-btn:hover { background-color: #732d91; }
        .explanation { display: none; margin-top: 20px; padding: 16px; background-color: #e8f8f5; border-left: 5px solid #1abc9c; border-radius: 0 8px 8px 0; }

        /* ПОПАП СТРАЙКА С КОТОМ */
        .streak-popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); text-align: center; z-index: 1000; border: 4px solid #f39c12; animation: popIn 0.3s ease-out; }
        .streak-popup img { max-width: 280px; border-radius: 12px; margin-top: 10px; }
        .streak-title { color: #f39c12; margin: 0; font-size: 28px; text-transform: uppercase; animation: shake 1s infinite; }
        @keyframes popIn { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        
    </style>
</head>
<body>

<div class="container">
    <!-- Логин -->
    <div id="login-container" class="login-screen">
        <h1>👋 Привет! Добро пожаловать в Тренажёр</h1>
        <p>Введи свой никнейм, чтобы начать обучение:</p>
        <input type="text" id="username-input" class="name-input" placeholder="Твой ник..." maxlength="15">
        <br>
        <button class="btn btn-primary" onclick="login()">Залететь ➔</button>
    </div>

    <!-- Главное меню -->
    <div id="menu-container">
        <div class="cabinet">
            <div class="user-info">👤 Ученик: <span id="display-name"></span></div>
            <div class="xp-badge">⭐ Опыт: <span id="display-xp">0</span> XP</div>
        </div>

        <div class="subject-tabs">
            <button class="tab-btn active" id="tab-russian" onclick="switchSubject('russian')">📘 Русский язык</button>
            <button class="tab-btn" id="tab-math" onclick="switchSubject('math')">📐 Математика</button>
        </div>

        <div id="subject-russian" class="subject-content">
            <button class="btn btn-rulebook" onclick="openRulebook('russian')">📖 Открыть Справочник (Русский)</button>
            <h3>Практика (по 10 вопросов)</h3>
            <div id="menu-russian-topics" class="topics-menu"></div>
        </div>

        <div id="subject-math" class="subject-content" style="display: none;">
            <button class="btn btn-rulebook" style="background-color: #e67e22;" onclick="openRulebook('math')">📖 Открыть Справочник (Математика)</button>
            <h3>Практика (по 10 вопросов)</h3>
            <div id="menu-math-topics" class="topics-menu"></div>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <button class="btn" style="background: #e74c3c; color: white; padding: 8px 15px;" onclick="logout()">Выйти из профиля</button>
        </div>
    </div>

    <!-- СПРАВОЧНИК ПРАВИЛ -->
    <div id="rulebook-container">
        <button class="btn btn-back" onclick="closeRulebook()">⬅ Назад</button>
        <h2 id="rulebook-title" style="margin-top: 30px;">Справочник</h2>
        <div id="rulebook-content"></div>
    </div>

    <!-- Квиз -->
    <div id="quiz-container" class="quiz-container">
        <button class="btn btn-back" onclick="returnToMenu()">⬅ Ливнуть</button>
        <div class="header-quiz">
            <h2 id="topic-title" style="margin:0; font-size:20px;"></h2>
            <div>
                <span id="streak-indicator" class="streak-indicator">🔥 Страйк: 0</span>
                <span id="progress" class="progress"></span>
            </div>
        </div>
        <div id="question-text" class="question"></div>
        
        <button id="hint-btn" class="btn btn-hint" onclick="showHint()">💡 Дать подсказку</button>
        <div id="hint-text" class="hint-text"></div>

        <div id="options-container" class="options"></div>
        <div id="explanation" class="explanation"></div>
        <button id="next-btn" class="btn next-btn" onclick="nextQuestion()">Некст вопрос ➔</button>
    </div>

    <!-- ПОПАП СТРАЙКА -->
    <div id="streak-popup" class="streak-popup">
        <h3 class="streak-title">🔥 3 В РЯД! СТРАЙК! 🔥</h3>
        <img id="streak-cat-img" src="" alt="Смешной кот">
    </div>

    <!-- Результат -->
    <div id="result-container" class="quiz-container" style="text-align:center;">
        <h2 id="result-title" style="font-size: 32px;"></h2>
        <p id="result-text" style="font-size: 18px; color: #7f8c8d;"></p>
        
        <!-- МОТИВАЦИЯ ПРИ ПОРАЖЕНИИ -->
        <div id="defeat-motivation" class="motivation-banner" style="display: none; margin: 20px auto; max-width: 80%;"></div>

        <div class="xp-badge" style="display: inline-block; font-size: 20px; margin: 20px 0;">+ <span id="earned-xp"></span> XP</div>
        <button class="btn btn-primary" style="display:block; width: 100%; margin-top:20px;" onclick="returnToMenu()">🏠 В меню</button>
    </div>
</div>

<script>
    // ПОЛНЫЕ БАЗЫ ПРАВИЛ
    const rulebooks = {
        russian: `
            <div class="rule-card">
                <h3>🔥 Спряжения глаголов</h3>
                <p><b>I спряжение:</b> инфинитивы НЕ на -ИТЬ (на -ать, -еть, -оть).<br>Окончания в 3 л. мн.ч.: <b>-УТ, -ЮТ</b> (борются).</p>
                <p><b>II спряжение:</b> все инфинитивы на -ИТЬ.<br>Окончания в 3 л. мн.ч.: <b>-АТ, -ЯТ</b> (пилят).</p>
                <p><b>Исключения II спр.:</b> гнать, держать, смотреть и видеть, дышать, слышать, ненавидеть, и зависеть, и вертеть, и обидеть, и терпеть.</p>
                <p><b>Исключения I спр.:</b> брить, стелить.</p>
            </div>
            <div class="rule-card">
                <h3>🌳 Корни с чередованием (ВСЕ ПРАВИЛА)</h3>
                <p><b>1. Зависят от суффикса -А-:</b><br>
                -БЕР-/-БИР-, -МЕР-/-МИР-, -ДЕР-/-ДИР-, -ПЕР-/-ПИР-, -ТЕР-/-ТИР-, -БЛЕСТ-/-БЛИСТ-, -ЖЕГ-/-ЖИГ-, -СТЕЛ-/-СТИЛ-, -ЧЕТ-/-ЧИТ-.<br>
                <i>(Есть суффикс А — в корне пишем И. Пример: собИрАть, но собЕру)</i>.<br>
                -КАС-/-КОС- <i>(Есть А — пишем А. Пример: кАсАться, но кОснуться)</i>.</p>
                
                <p><b>2. Зависят от ударения:</b><br>
                -ГАР-/-ГОР-, -КЛАН-/-КЛОН-, -ТВАР-/-ТВОР- <i>(Без ударения пишем О: загорАть. Искл: утварь)</i>.<br>
                -ЗАР-/-ЗОР- <i>(Без ударения пишем А: зарЯ. Искл: зоревать)</i>.</p>
                
                <p><b>3. Зависят от согласной:</b><br>
                -РАСТ-/-РАЩ-/-РОС- <i>(Перед СТ и Щ пишем А. Пример: вырАсти. Искл: росток, Ростов, ростовщик, отрасль)</i>.<br>
                -ЛАГ-/-ЛОЖ- <i>(Перед Г пишем А, перед Ж пишем О. Пример: прилАгать, прилОжить. Искл: полог)</i>.<br>
                -СКАК-/-СКОЧ- <i>(Перед К пишем А, перед Ч пишем О. Искл: скачок, скачу)</i>.</p>

                <p><b>4. Зависят от смысла:</b><br>
                -МАК- (погружать) / -МОК- (пропускать жидкость).<br>
                -РАВН- (одинаковый) / -РОВН- (гладкий). <i>(Искл: равнина, ровесник, поровну, уровень)</i>.</p>
            </div>
        `,
        math: `
            <div class="rule-card">
                <h3>➖ Отрицательные числа</h3>
                <p><b>Сложение:</b> долг + долг = большой долг. Складываем числа и ставим минус. (-5 - 3 = -8)</p>
                <p><b>Умножение и деление:</b><br>
                Минус на минус = ПЛЮС (-3 * -4 = 12)<br>
                Минус на плюс = МИНУС (-20 / 4 = -5)</p>
            </div>
            <div class="rule-card">
                <h3>🍕 Дроби и Проценты</h3>
                <p><b>Сложение дробей:</b> Знаменатель остаётся прежним, складываем числители. (1/5 + 2/5 = 3/5).</p>
                <p><b>Проценты:</b> Процент — это 1/100.<br>
                50% — это половина (раздели на 2).<br>
                25% — это четверть (раздели на 4).<br>
                10% — это десятая часть (раздели на 10).</p>
            </div>
        `
    };

    // МОТИВАЦИЯ ПРИ ПОРАЖЕНИИ
    const motivations = [
        "Ошибки — это минус вайб, но мы это исправим! 😼 Не тильтуй!",
        "Главное не тильтовать! Почитай справочник и возвращайся 🐾",
        "Спокуха, даже гении иногда делают ошибки. Вперёд! 🌟",
        "Падение — это часть пути к успеху. Попробуй ещё раз! 💪",
        "Тяжело в учении, легко в бою! Не сдавайся! 🚀"
    ];

    // ССЫЛКИ ДЛЯ СТРАЙКОВ (Смешные коты)
    const funnyCats = [
        "https://cataas.com/cat/says/СИГМА?fontColor=white&fontSize=50",
        "https://cataas.com/cat/says/ГЕНИЙ?fontColor=yellow&fontSize=50",
        "https://cataas.com/cat/says/ЧИНАЗЕС?fontColor=white&fontSize=50",
        "https://cataas.com/cat/says/ИМБА?fontColor=red&fontSize=60"
    ];

    // БАЗА ДАННЫХ ВОПРОСОВ 
    const db = {
        russian: {
            verbs: {
                title: "Спряжения глаголов (10 вопросов)",
                questions: [
                    { q: "Где пишется Ю (окончание -ЮТ)?", opts: ["Они стро..т", "Они бор..тся", "Они завис..т", "Они пил..т"], a: 1, hint: "Инфинитив оканчивается на -ОТЬСЯ.", expl: "Бороться (I спр.) -> борЮТся." },
                    { q: "Где пишется Я (окончание -ЯТ)?", opts: ["Снежинки та..т", "Собаки ла..т", "Они кле..т", "Ветры ве..т"], a: 2, hint: "Инфинитив оканчивается на -ИТЬ.", expl: "Клеить — II спряжение (клеЯТ)." },
                    { q: "Какой глагол относится ко II спряжению (исключение)?", opts: ["Брить", "Стелить", "Гнать", "Сеять"], a: 2, hint: "Вспомни стишок: гнать, держать, смотреть и видеть...", expl: "Гнать — исключение II спряжения." },
                    { q: "Где пишется А (окончание -АТ)?", opts: ["Пациенты дыш..т", "Они пряч..т", "Они плач..т", "Они скач..т"], a: 0, hint: "Этот глагол — исключение, оканчивается на -АТЬ.", expl: "Дышать (искл. II спр.) -> дышАТ." },
                    { q: "Как правильно: «Он...»?", opts: ["бреет", "бреит", "стелит", "гонют"], a: 0, hint: "Глагол-исключение I спряжения.", expl: "Брить — искл. I спр. (он бреЕТ)." },
                    { q: "Они стел..т постель. Какая буква?", opts: ["ю", "я", "и", "е"], a: 0, hint: "Стелить — это глагол-исключение I спряжения.", expl: "Стелить (искл. I спр.) -> стелЮТ." },
                    { q: "Ученики смотр..т в окно. Какая буква?", opts: ["ю", "я", "у", "е"], a: 1, hint: "Смотреть — глагол-исключение II спряжения.", expl: "Смотреть (искл. II спр.) -> смотрЯТ." },
                    { q: "Спортсмены завис..т от тренера. Какая буква?", opts: ["ю", "я", "у", "е"], a: 1, hint: "Гнать, держать, дышать, зависеть...", expl: "Зависеть (искл. II спр.) -> зависЯТ." },
                    { q: "Они наде..тся на чудо. Какая буква?", opts: ["я", "ю", "и", "е"], a: 1, hint: "Инфинитив: надеЯТЬся (I спряжение).", expl: "Надеяться (I спр.) -> надеЮТся." },
                    { q: "Малыши плач..т. Какая буква?", opts: ["а", "я", "у", "ю"], a: 2, hint: "Плакать — не исключение, на -АТЬ.", expl: "Плакать (I спр.) -> плачУТ." }
                ]
            },
            roots: {
                title: "Корни с чередованием (10 вопросов)",
                questions: [
                    { q: "В каком слове пишется А?", opts: ["К..снуться", "Прик..сновение", "К..саться", "Неук..снительно"], a: 2, hint: "Посмотри, есть ли суффикс -А- сразу после корня.", expl: "КасАться (есть суффикс -А-)." },
                    { q: "Где пишется О?", opts: ["К..сание", "К..сательная", "Прик..саться", "Прик..снуться"], a: 3, hint: "Суффикса -А- после корня нет.", expl: "ПрикОснуться (нет суффикса -А-)." },
                    { q: "Где пишется О?", opts: ["З..гар", "Заг..рать", "Уг..р", "Разг..р"], a: 1, hint: "В корне ГАР/ГОР без ударения пишется О.", expl: "ЗагорАть (без ударения пишем О)." },
                    { q: "В каком слове пишется И?", opts: ["Заб..ру", "Зам..реть", "Заб..рать", "Соб..рут"], a: 2, hint: "Правило ослика ИА: если после корня А, в корне пиши И.", expl: "ЗабИрАть." },
                    { q: "Где пишется А?", opts: ["Отр..сль", "Р..сток", "Р..стовщик", "Выр..с"], a: 0, hint: "Это слово-исключение, которое пишется через А.", expl: "Отрасль — это исключение (пишется с А)." },
                    { q: "Найди слово с ошибкой:", opts: ["Вырастить", "Полагать", "Заросли", "Росток"], a: 3, hint: "Это слово-исключение из правила про РАСТ/РАЩ/РОС.", expl: "Р_о_сток — это исключение (пишется с О)." },
                    { q: "Ученик прил..жил усилия. Какая буква?", opts: ["а", "о", "и", "е"], a: 1, hint: "В корне ЛАГ/ЛОЖ перед Ж пишется О.", expl: "ПрилОжить (перед Ж пишем О)." },
                    { q: "Скакать на лошади. Какое правило у корня?", opts: ["От ударения", "От суффикса А", "От согласной", "От смысла"], a: 2, hint: "СКАК/СКОЧ зависит от последней буквы корня (К или Ч).", expl: "Зависит от согласной (перед К пишем А, перед Ч пишем О)." },
                    { q: "Соб..ру портфель. Какая буква?", opts: ["и", "е", "а", "о"], a: 1, hint: "Суффикса -А- за корнем нет.", expl: "СобЕру (нет суффикса -А-)." },
                    { q: "Бескрайняя р..внина. Какая буква?", opts: ["о", "а", "и", "е"], a: 1, hint: "Это слово-исключение из правила про РАВН/РОВН.", expl: "Равнина — слово-исключение, пишется с А." }
                ]
            }
        },
        math: {
            fractions: {
                title: "Дроби и проценты (10 вопросов)",
                questions: [
                    { q: "Вычисли: 1/2 + 1/2 = ?", opts: ["1/4", "1", "2/4", "2"], a: 1, hint: "Половина плюс половина равно...", expl: "1/2 + 1/2 = 2/2 = 1." },
                    { q: "Сколько будет 25% от 200?", opts: ["25", "50", "100", "75"], a: 1, hint: "25% — это четвертая часть числа. Раздели 200 на 4.", expl: "200 / 4 = 50." },
                    { q: "Переведи 50% в обыкновенную дробь:", opts: ["1/4", "1/3", "1/2", "3/4"], a: 2, hint: "50% — это ровно половина.", expl: "50% = 50/100 = 1/2." },
                    { q: "Вычисли: 1 - 3/7 = ?", opts: ["4/7", "3/7", "1/7", "7/7"], a: 0, hint: "Представь единицу как 7/7.", expl: "7/7 - 3/7 = 4/7." },
                    { q: "Чему равна дробь 3/4 в процентах?", opts: ["34%", "50%", "75%", "100%"], a: 2, hint: "1/4 = 25%. Умножь 25% на 3.", expl: "3/4 = 0.75 = 75%." },
                    { q: "Вычисли: 0.5 * 4 = ?", opts: ["0.20", "2", "4.5", "20"], a: 1, hint: "0.5 — это половина. Половина от 4 — это...", expl: "0.5 * 4 = 2." },
                    { q: "Сколько будет 10% от 500?", opts: ["5", "10", "50", "500"], a: 2, hint: "Чтобы найти 10%, нужно число разделить на 10.", expl: "500 / 10 = 50." },
                    { q: "Вычисли: 2/5 + 1/5 = ?", opts: ["3/5", "3/10", "2/25", "1/5"], a: 0, hint: "Складывай только числители, знаменатель оставь прежним.", expl: "2/5 + 1/5 = 3/5." },
                    { q: "Сравни: что больше, 0.2 или 1/5?", opts: ["0.2 больше", "1/5 больше", "Они равны", "Нельзя сравнить"], a: 2, hint: "Переведи 1/5 в десятичную дробь (умножь верх и низ на 2).", expl: "1/5 = 2/10 = 0.2. Они равны." },
                    { q: "Вычисли: 1.2 + 0.8 = ?", opts: ["1.10", "2", "2.0", "Оба варианта 2 и 2.0 верны"], a: 3, hint: "Сложи целые и десятые части отдельно.", expl: "1.2 + 0.8 = 2.0 = 2." }
                ]
            },
            negatives: {
                title: "Отрицательные числа (10 вопросов)",
                questions: [
                    { q: "Вычисли: -5 + 3 = ?", opts: ["-8", "2", "-2", "8"], a: 2, hint: "У тебя долг 5 рублей, ты отдал 3. Сколько долга осталось?", expl: "-5 + 3 = -2." },
                    { q: "Вычисли: -10 - 5 = ?", opts: ["-5", "-15", "5", "15"], a: 1, hint: "Два отрицательных числа складываются, и ставится знак минус.", expl: "-10 - 5 = -15." },
                    { q: "Какое число больше: -5 или -10?", opts: ["-5", "-10", "Они равны", "Ноль"], a: 0, hint: "На координатной прямой число правее всегда больше. -5 ближе к нулю.", expl: "-5 больше, чем -10." },
                    { q: "Вычисли: -4 * (-3) = ?", opts: ["-12", "12", "-7", "7"], a: 1, hint: "Минус на минус при умножении дает плюс.", expl: "-4 * (-3) = 12." },
                    { q: "Вычисли: 20 / (-4) = ?", opts: ["-5", "5", "-16", "24"], a: 0, hint: "Плюс разделить на минус дает минус.", expl: "20 / -4 = -5." },
                    { q: "Чему равен модуль |-8|?", opts: ["-8", "0", "8", "1"], a: 2, hint: "Модуль — это расстояние от нуля, оно всегда положительное.", expl: "|-8| = 8." },
                    { q: "Вычисли: -7 + 7 = ?", opts: ["-14", "14", "0", "-7"], a: 2, hint: "Сумма противоположных чисел равна нулю.", expl: "-7 + 7 = 0." },
                    { q: "Вычисли: -15 - (-5) = ?", opts: ["-20", "-10", "10", "20"], a: 1, hint: "Два минуса подряд превращаются в плюс: -15 + 5.", expl: "-15 - (-5) = -15 + 5 = -10." },
                    { q: "Вычисли: -1 * 0 = ?", opts: ["-1", "1", "0", "Нет ответа"], a: 2, hint: "Любое число, умноженное на ноль, дает ноль.", expl: "При умножении на 0 всегда получается 0." },
                    { q: "Вычисли: 10 + (-15) = ?", opts: ["25", "-25", "-5", "5"], a: 2, hint: "Это то же самое, что 10 - 15.", expl: "10 - 15 = -5." }
                ]
            }
        }
    };

    let currentUser = { name: "", xp: 0 };
    let currentSubject = "russian";
    let currentTopicId = "";
    let currentQuestionIndex = 0;
    let score = 0;
    
    // ПЕРЕМЕННАЯ ДЛЯ СТРАЙКОВ
    let currentStreak = 0;
    let streakTimeout = null;

    window.onload = () => {
        const saved = localStorage.getItem('superQuizV6');
        if (saved) { currentUser = JSON.parse(saved); showMenu(); } 
        else { document.getElementById("login-container").style.display = "block"; }
    };

    function login() {
        const name = document.getElementById("username-input").value.trim();
        if (!name) return;
        currentUser = { name: name, xp: 0 };
        saveData(); showMenu();
    }
    
    function logout() { localStorage.removeItem('superQuizV6'); location.reload(); }
    function saveData() { localStorage.setItem('superQuizV6', JSON.stringify(currentUser)); }

    function switchSubject(subject) {
        currentSubject = subject;
        document.getElementById("tab-russian").classList.remove("active");
        document.getElementById("tab-math").classList.remove("active");
        document.getElementById(`tab-${subject}`).classList.add("active");
        
        document.getElementById("subject-russian").style.display = "none";
        document.getElementById("subject-math").style.display = "none";
        document.getElementById(`subject-${subject}`).style.display = "block";
    }

    function showMenu() {
        document.getElementById("login-container").style.display = "none";
        document.getElementById("quiz-container").style.display = "none";
        document.getElementById("result-container").style.display = "none";
        document.getElementById("rulebook-container").style.display = "none";
        document.getElementById("menu-container").style.display = "block";
        
        document.getElementById("display-name").innerText = currentUser.name;
        document.getElementById("display-xp").innerText = currentUser.xp;
        
        renderTopics("russian", "menu-russian-topics");
        renderTopics("math", "menu-math-topics");
    }

    function openRulebook(subject) {
        document.getElementById("menu-container").style.display = "none";
        document.getElementById("rulebook-container").style.display = "block";
        let subjectName = subject === 'russian' ? 'Русскому языку' : 'Математике';
        document.getElementById("rulebook-title").innerText = `📖 Справочник по ${subjectName}`;
        document.getElementById("rulebook-content").innerHTML = rulebooks[subject];
    }

    function closeRulebook() { showMenu(); }

    function renderTopics(subj, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        for (const key in db[subj]) {
            const btn = document.createElement("button");
            btn.className = "topic-btn";
            btn.innerHTML = db[subj][key].title;
            btn.onclick = () => startQuiz(subj, key);
            container.appendChild(btn);
        }
    }

    function startQuiz(subj, topic) {
        currentSubject = subj; currentTopicId = topic; 
        currentQuestionIndex = 0; score = 0; currentStreak = 0;
        
        document.getElementById("menu-container").style.display = "none";
        document.getElementById("quiz-container").style.display = "block";
        document.getElementById("topic-title").innerText = db[subj][topic].title;
        updateStreakUI();
        
        loadQuestion();
    }

    function returnToMenu() { showMenu(); }

    function loadQuestion() {
        const q = db[currentSubject][currentTopicId].questions[currentQuestionIndex];
        const total = db[currentSubject][currentTopicId].questions.length;
        
        document.getElementById("progress").innerText = `Вопрос ${currentQuestionIndex + 1} из ${total}`;
        document.getElementById("question-text").innerText = q.q;
        
        document.getElementById("hint-btn").style.display = "inline-block";
        document.getElementById("hint-text").style.display = "none";
        document.getElementById("hint-text").innerText = q.hint;
        
        const optsContainer = document.getElementById("options-container");
        optsContainer.innerHTML = "";
        
        q.opts.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.className = "option-btn"; btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optsContainer.appendChild(btn);
        });

        document.getElementById("explanation").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
    }

    function showHint() {
        document.getElementById("hint-btn").style.display = "none";
        document.getElementById("hint-text").style.display = "block";
    }

    function checkAnswer(selectedIndex, btnElement) {
        const q = db[currentSubject][currentTopicId].questions[currentQuestionIndex];
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach(btn => btn.disabled = true);
        document.getElementById("hint-btn").style.display = "none";
        
        if (selectedIndex === q.a) {
            btnElement.classList.add("correct");
            score++;
            currentStreak++;
            
            // ПРОВЕРКА НА СТРАЙК 3
            if (currentStreak === 3) {
                triggerStreakCat();
                currentStreak = 0; // Сбрасываем, чтобы страйк мог повториться
            }
        } else {
            btnElement.classList.add("wrong");
            buttons[q.a].classList.add("correct");
            currentStreak = 0; // Сброс страйка при ошибке
        }

        updateStreakUI();

        const expl = document.getElementById("explanation");
        expl.innerHTML = `<b>Правило:</b> ${q.expl}`;
        expl.style.display = "block";
        document.getElementById("next-btn").style.display = "block";
    }

    function updateStreakUI() {
        const ind = document.getElementById("streak-indicator");
        if (currentStreak > 0) {
            ind.style.display = "inline-block";
            ind.innerText = `🔥 Страйк: ${currentStreak}`;
        } else {
            ind.style.display = "none";
        }
    }

    function triggerStreakCat() {
        const popup = document.getElementById("streak-popup");
        const img = document.getElementById("streak-cat-img");
        // Берем случайного кота и добавляем время, чтобы картинка точно загрузилась заново
        img.src = funnyCats[Math.floor(Math.random() * funnyCats.length)] + "&t=" + Date.now();
        
        popup.style.display = "block";
        
        // Убираем попап через 2.5 секунды
        if(streakTimeout) clearTimeout(streakTimeout);
        streakTimeout = setTimeout(() => {
            popup.style.display = "none";
        }, 2500);
    }

    function nextQuestion() {
        // Убираем попап страйка если он еще висит
        document.getElementById("streak-popup").style.display = "none";
        
        currentQuestionIndex++;
        if (currentQuestionIndex < db[currentSubject][currentTopicId].questions.length) loadQuestion();
        else showResults();
    }

    function showResults() {
        document.getElementById("quiz-container").style.display = "none";
        document.getElementById("result-container").style.display = "block";
        
        const total = db[currentSubject][currentTopicId].questions.length;
        const percent = (score / total) * 100;
        
        let xpGained = score * 20; 
        if (percent === 100) xpGained += 50; 
        
        currentUser.xp += xpGained; saveData();
        document.getElementById("earned-xp").innerText = xpGained;
        
        // МОТИВАЦИЯ ТОЛЬКО ПРИ ПОРАЖЕНИИ (< 50%)
        const defeatMotiv = document.getElementById("defeat-motivation");
        if (percent < 50) {
            defeatMotiv.innerText = motivations[Math.floor(Math.random() * motivations.length)];
            defeatMotiv.style.display = "block";
        } else {
            defeatMotiv.style.display = "none";
        }

        if (percent === 100) {
            document.getElementById("result-title").innerText = "🏆 Идеально! Ты просто Гигачад!";
            document.getElementById("result-text").innerText = "10 из 10! +1000 к ауре! Чиназес! 🗿😎";
            confetti({ particleCount: 150, spread: 100 });
        } else if (percent >= 50) {
            document.getElementById("result-title").innerText = "😎 Хорошая работа! Норм вайб!";
            document.getElementById("result-text").innerText = `Твой результат: ${score} из ${total}. Сюдааа, идём дальше! 😼`;
            confetti({ particleCount: 80, spread: 80 });
        } else {
            document.getElementById("result-title").innerText = "😿 Тильт... Но мы не сдаёмся!";
            document.getElementById("result-text").innerText = `Отвечено правильно: ${score} из ${total}. Читай теорию и погнали заново!`;
        }
    }
</script>

</body>
</html>
