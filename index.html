<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажёр по русскому языку | Личный кабинет</title>
    <!-- Подключаем библиотеку для салюта (конфетти) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #2c3e50;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            position: relative;
        }
        h1, h2 { text-align: center; color: #1a252f; }
        
        /* Стили для личного кабинета */
        .cabinet {
            background: #eaf2f8;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #3498db;
        }
        .user-info { font-size: 18px; font-weight: bold; }
        .xp-badge {
            background: #f1c40f;
            color: #8e44ad;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .login-screen { text-align: center; padding: 40px 0; }
        .name-input {
            padding: 12px; font-size: 18px; border: 2px solid #bdc3c7;
            border-radius: 8px; width: 60%; margin-bottom: 20px;
        }
        
        /* Кнопки */
        .btn {
            padding: 12px 25px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 16px; font-weight: bold; transition: all 0.2s;
        }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover { background-color: #2980b9; transform: translateY(-2px); }
        .btn-back {
            background-color: #7f8c8d; color: white; position: absolute;
            top: 20px; left: 20px; padding: 8px 15px; font-size: 14px;
        }
        .btn-back:hover { background-color: #95a5a6; }

        /* Разделы меню */
        .category-title { margin-top: 30px; margin-bottom: 15px; color: #34495e; border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; }
        .topics-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        .topic-btn {
            padding: 15px; background-color: #2ecc71; color: white; border: none;
            border-radius: 12px; cursor: pointer; font-size: 15px; font-weight: 600;
            text-align: left; box-shadow: 0 4px 6px rgba(46, 204, 113, 0.2); transition: all 0.2s;
        }
        .topic-btn:hover { background-color: #27ae60; transform: translateY(-2px); }
        .topic-btn.completed { background-color: #95a5a6; }
        
        .quiz-container, #menu-container { display: none; }
        
        .header-quiz { display: flex; justify-content: center; align-items: center; margin-top: 30px; margin-bottom: 20px; }
        .progress { font-weight: bold; color: #3498db; background: #ebf5fb; padding: 5px 12px; border-radius: 20px; margin-left: 15px; }
        .question { font-size: 20px; margin-bottom: 25px; font-weight: 600; }
        .options { display: grid; gap: 12px; }
        
        /* Стили кнопок ответов и АНИМАЦИИ */
        .option-btn {
            padding: 16px 20px; background-color: #f8f9f9; border: 2px solid #bdc3c7; border-radius: 10px;
            cursor: pointer; text-align: left; font-size: 16px; transition: all 0.2s;
        }
        .option-btn:hover:not(:disabled) { background-color: #ecf0f1; border-color: #95a5a6; }
        
        /* Анимация правильного ответа (пульсация) */
        @keyframes popPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        /* Анимация неправильного ответа (тряска) */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .correct { background-color: #e8f8f5 !important; border-color: #2ecc71 !important; color: #27ae60; animation: popPulse 0.4s ease-in-out; }
        .wrong { background-color: #fdedec !important; border-color: #e74c3c !important; color: #c0392b; animation: shake 0.4s ease-in-out; }
        
        .next-btn { display: none; margin-top: 25px; width: 100%; background-color: #f39c12; color: white; }
        .next-btn:hover { background-color: #d68910; }
        .explanation { display: none; margin-top: 20px; padding: 16px; background-color: #e8f8f5; border-left: 5px solid #1abc9c; border-radius: 0 8px 8px 0; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-container" class="login-screen">
        <h1>👋 Привет! Добро пожаловать в Тренажёр</h1>
        <p>Введи своё имя, чтобы начать и сохранять опыт:</p>
        <input type="text" id="username-input" class="name-input" placeholder="Твоё имя или никнейм..." maxlength="15">
        <br>
        <button class="btn btn-primary" onclick="login()">Начать обучение ➔</button>
    </div>

    <div id="menu-container">
        <div class="cabinet">
            <div class="user-info">👤 Ученик: <span id="display-name"></span></div>
            <div class="xp-badge">⭐ Опыт: <span id="display-xp">0</span> XP</div>
        </div>
        
        <h2>Выбери подтему для тренировки:</h2>
        
        <h3 class="category-title">📘 Глагол</h3>
        <div id="menu-verbs" class="topics-menu"></div>

        <h3 class="category-title">🌳 Корни с чередованием</h3>
        <div id="menu-roots" class="topics-menu"></div>

        <h3 class="category-title">🧩 Приставки</h3>
        <div id="menu-prefixes" class="topics-menu"></div>
        
        <h3 class="category-title">👤 Существительное</h3>
        <div id="menu-nouns" class="topics-menu"></div>

        <div style="text-align: center; margin-top: 40px;">
            <button class="btn" style="background: #e74c3c; color: white; padding: 8px 15px;" onclick="logout()">Выйти из профиля</button>
        </div>
    </div>

    <div id="quiz-container" class="quiz-container">
        <button class="btn btn-back" onclick="returnToMenu()">⬅ Назад</button>
        <div class="header-quiz">
            <h2 id="topic-title" style="margin:0; font-size:20px;"></h2>
            <div id="progress" class="progress"></div>
        </div>
        <div id="question-text" class="question"></div>
        <div id="options-container" class="options"></div>
        <div id="explanation" class="explanation"></div>
        <button id="next-btn" class="btn next-btn" onclick="nextQuestion()">Следующий вопрос ➔</button>
    </div>

    <div id="result-container" class="quiz-container" style="text-align:center;">
        <h2 id="result-title" style="font-size: 32px;"></h2>
        <p id="result-text" style="font-size: 18px; color: #7f8c8d;"></p>
        <div class="xp-badge" style="display: inline-block; font-size: 20px; margin: 20px 0;">+ <span id="earned-xp"></span> XP</div>
        <button class="btn btn-primary" style="display:block; width: 100%; margin-top:20px;" onclick="returnToMenu()">🏠 Вернуться в кабинет</button>
    </div>
</div>

<script>
    // Огромная база данных, разбитая на мелкие подтемы!
    const quizData = {
        // --- ГЛАГОЛЫ ---
        verbs_1: {
            category: "menu-verbs", title: "Спряжения: окончания -ут/-ют, -ат/-ят",
            questions: [
                { question: "Где пишется Ю (окончание -ЮТ)?", options: ["Они стро..т", "Они бор..тся", "Они завис..т", "Они пил..т"], correct: 1, explanation: "Бороться (I спряжение) -> борЮТся. Строить, пилить (II спр.) -> строЯТ, пилЯТ." },
                { question: "Где пишется А (окончание -АТ)?", options: ["Они пряч..т", "Они плач..т", "Пациенты дыш..т", "Они скач..т"], correct: 2, explanation: "Дышать — глагол-исключение II спряжения. Поэтому они дышАТ. Остальные (плакать, скакать, прятать) — I спряжение (УТ)." },
                { question: "Где пишется Я (окончание -ЯТ)?", options: ["Снежинки та..т", "Собаки ла..т", "Они кле..т", "Ветры ве..т"], correct: 2, explanation: "Клеить — II спряжение (они клеЯТ). Таять, лаять, веять — на -ять, I спряжение (они таЮТ, лаЮТ, веЮТ)." }
            ]
        },
        verbs_2: {
            category: "menu-verbs", title: "Глаголы-исключения",
            questions: [
                { question: "Какой глагол относится ко II спряжению (исключение)?", options: ["Брить", "Стелить", "Гнать", "Сеять"], correct: 2, explanation: "Гнать — исключение II спряжения. Брить, стелить — исключения I спряжения." },
                { question: "Как правильно: «Он...»?", options: ["бреет", "бреит", "стелит", "гонют"], correct: 0, explanation: "Брить — исключение I спряжения, поэтому он бреЕТ." },
                { question: "Укажи ошибку:", options: ["Он видит", "Они зависят", "Он стелет", "Они смотрют"], correct: 3, explanation: "Смотреть — исключение II спряжения. Значит, они смотрЯТ." }
            ]
        },
        verbs_3: {
            category: "menu-verbs", title: "Правописание -ТСЯ и -ТЬСЯ",
            questions: [
                { question: "Где нужен мягкий знак (Ь)?", options: ["Он учит..ся", "Нужно готовит..ся", "Солнце садит..ся", "Брат улыбает..ся"], correct: 1, explanation: "Задаем вопрос: нужно (что делаТЬ?) готовитьСЯ. Раз в вопросе есть Ь, то и в слове есть." },
                { question: "Где мягкий знак НЕ нужен?", options: ["Мне нравит..ся зима", "Хочу отправит..ся в лес", "Она любит смеят..ся", "Пора ложит..ся"], correct: 0, explanation: "Зима (что делаЕТ?) нравиТСЯ. В вопросе нет мягкого знака." },
                { question: "«Вам придёт..ся остат..ся». Какие буквы пропущены?", options: ["тся, тся", "ться, ться", "тся, ться", "ться, тся"], correct: 2, explanation: "(Что сделаЕТ?) придёТСЯ (что сделаТЬ?) остаТЬСЯ." }
            ]
        },

        // --- КОРНИ ---
        roots_1: {
            category: "menu-roots", title: "Корни -кас-/-кос-",
            questions: [
                { question: "Где пишется А?", options: ["К..снуться", "Прик..сновение", "К..саться", "Неук..снительно"], correct: 2, explanation: "Пишем А, потому что после корня стоит суффикс -А- (касАться)." },
                { question: "Где пишется О?", options: ["К..сание", "К..сательная", "Прик..саться", "Прик..снуться"], correct: 3, explanation: "В слове прикоснуться нет суффикса -А- после корня, поэтому пишем О." }
            ]
        },
        roots_2: {
            category: "menu-roots", title: "Корни -гар-/-гор-",
            questions: [
                { question: "Где пишется О?", options: ["З..гар", "Заг..рать", "Уг..р", "Разг..р"], correct: 1, explanation: "Корень -гар-/-гор- зависит от ударения. Без ударения пишем О (загорАть)." },
                { question: "Какое правило у слова «заг..р»?", options: ["О без ударения", "А под ударением", "Зависит от суффикса", "Это исключение"], correct: 1, explanation: "В этом корне под ударением пишется А." }
            ]
        },
        roots_3: {
            category: "menu-roots", title: "Корни с чередованием И/Е (-бер-/-бир-, -мер-/-мир-)",
            questions: [
                { question: "Где пишется И?", options: ["Заб..ру", "Зам..реть", "Заб..рать", "Соб..рут"], correct: 2, explanation: "Если после корня есть суффикс -А-, пишем И (забИрАть)." },
                { question: "Где пишется Е?", options: ["Отм..рать", "Бл..стеть", "Выт..рать", "Расст..лать"], correct: 1, explanation: "В слове «блестеть» нет суффикса -А-, поэтому в корне пишем Е." }
            ]
        },

        // --- ПРИСТАВКИ ---
        prefixes_1: {
            category: "menu-prefixes", title: "Приставка ПРЕ-",
            questions: [
                { question: "Где пишется ПРЕ- в значении «очень»?", options: ["Пр..землиться", "Пр..открыть", "Пр..мудрый", "Пр..шить"], correct: 2, explanation: "Премудрый = очень мудрый." },
                { question: "Где ПРЕ- равна приставке ПЕРЕ-?", options: ["Пр..градить", "Пр..добрый", "Пр..морский", "Пр..ехать"], correct: 0, explanation: "Преградить = ПЕРЕгородить." }
            ]
        },
        prefixes_2: {
            category: "menu-prefixes", title: "Приставка ПРИ-",
            questions: [
                { question: "Какое слово обозначает неполное действие?", options: ["Пр..ехать", "Пр..клеить", "Пр..сесть", "Пр..морский"], correct: 2, explanation: "Присесть — значит сесть ненадолго (неполное действие)." },
                { question: "Где ПРИ- обозначает присоединение?", options: ["Пр..увеличить", "Пр..шить", "Пр..рвать", "Пр..скверный"], correct: 1, explanation: "Пришить пуговицу = присоединить её к ткани." }
            ]
        },

        // --- СУЩЕСТВИТЕЛЬНЫЕ ---
        nouns_1: {
            category: "menu-nouns", title: "Суффиксы -ЕК- и -ИК-",
            questions: [
                { question: "В каком слове пишется ИК?", options: ["Замоч..к", "Ключ..к", "Ореш..к", "Сыноч..к"], correct: 1, explanation: "Ставим в Родительный падеж (нет чего?). КлючИКа — буква И не выпадает, значит -ИК-." },
                { question: "В каком слове пишется ЕК?", options: ["Мяч..к", "Карандаш..к", "Кусоч..к", "Лучик..к"], correct: 2, explanation: "Нет кусоЧКа — гласная выпала, значит пишем -ЕК-." }
            ]
        },
        nouns_2: {
            category: "menu-nouns", title: "Суффиксы -ЧИК- и -ЩИК-",
            questions: [
                { question: "Где пишется ЧИК?", options: ["Груз..ик", "Спор..ик", "Свар..ик", "Камен..ик"], correct: 0, explanation: "ЧИК пишется после согласных д-т, з-с, ж (груЗ - грузчик)." },
                { question: "Где пишется ЩИК?", options: ["Перевод..ик", "Объезд..ик", "Разнос..ик", "Барабан..ик"], correct: 3, explanation: "После буквы Н (и других, кроме д,т,з,с,ж) пишется ЩИК (барабанщик)." }
            ]
        }
    };

    let currentUser = { name: "", xp: 0, completed: [] };
    let currentTopic = "";
    let currentQuestionIndex = 0;
    let score = 0;

    window.onload = () => {
        const savedUser = localStorage.getItem('quizUserPro');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            showMenu();
        } else {
            document.getElementById("login-container").style.display = "block";
        }
    };

    function login() {
        const nameInput = document.getElementById("username-input").value.trim();
        if (nameInput === "") return;
        currentUser = { name: nameInput, xp: 0, completed: [] };
        saveData();
        showMenu();
    }

    function logout() {
        localStorage.removeItem('quizUserPro');
        location.reload();
    }

    function saveData() {
        localStorage.setItem('quizUserPro', JSON.stringify(currentUser));
        document.getElementById("display-name").innerText = currentUser.name;
        document.getElementById("display-xp").innerText = currentUser.xp;
    }

    function showMenu() {
        document.getElementById("login-container").style.display = "none";
        document.getElementById("quiz-container").style.display = "none";
        document.getElementById("result-container").style.display = "none";
        document.getElementById("menu-container").style.display = "block";
        
        saveData(); // Обновляет UI кабинета
        
        // Очищаем меню
        document.getElementById("menu-verbs").innerHTML = "";
        document.getElementById("menu-roots").innerHTML = "";
        document.getElementById("menu-prefixes").innerHTML = "";
        document.getElementById("menu-nouns").innerHTML = "";
        
        // Распределяем кнопки по категориям
        for (const key in quizData) {
            const btn = document.createElement("button");
            btn.className = "topic-btn";
            
            if (currentUser.completed.includes(key)) {
                btn.classList.add("completed");
                btn.innerHTML = `✅ ${quizData[key].title}`;
            } else {
                btn.innerHTML = quizData[key].title;
            }
            
            btn.onclick = () => startQuiz(key);
            document.getElementById(quizData[key].category).appendChild(btn);
        }
    }

    function startQuiz(topicKey) {
        currentTopic = topicKey;
        currentQuestionIndex = 0;
        score = 0;
        
        document.getElementById("menu-container").style.display = "none";
        document.getElementById("result-container").style.display = "none";
        document.getElementById("quiz-container").style.display = "block";
        document.getElementById("topic-title").innerText = quizData[topicKey].title;
        
        loadQuestion();
    }

    function returnToMenu() { showMenu(); }

    function loadQuestion() {
        const q = quizData[currentTopic].questions[currentQuestionIndex];
        const total = quizData[currentTopic].questions.length;
        
        document.getElementById("progress").innerText = `Вопрос ${currentQuestionIndex + 1} из ${total}`;
        document.getElementById("question-text").innerText = q.question;
        
        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";
        
        q.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optionsContainer.appendChild(btn);
        });

        document.getElementById("explanation").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
    }

    // МИНИ-САЛЮТ при правильном ответе
    function shootMiniConfetti() {
        confetti({
            particleCount: 40,
            spread: 60,
            origin: { y: 0.7 },
            colors: ['#2ecc71', '#3498db', '#f1c40f']
        });
    }

    // БОЛЬШОЙ САЛЮТ при победе
    function shootBigConfetti() {
        var duration = 2 * 1000;
        var end = Date.now() + duration;
        (function frame() {
            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 } });
            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 } });
            if (Date.now() < end) requestAnimationFrame(frame);
        }());
    }

    function checkAnswer(selectedIndex, btnElement) {
        const q = quizData[currentTopic].questions[currentQuestionIndex];
        const buttons = document.querySelectorAll(".option-btn");
        
        buttons.forEach(btn => btn.disabled = true); // Блокируем кнопки
        
        if (selectedIndex === q.correct) {
            // ПРАВИЛЬНО: анимация пульсации и мини-салют
            btnElement.classList.add("correct");
            shootMiniConfetti(); 
            score++;
        } else {
            // НЕПРАВИЛЬНО: анимация тряски
            btnElement.classList.add("wrong");
            buttons[q.correct].classList.add("correct");
        }

        const expl = document.getElementById("explanation");
        expl.innerText = "💡 Правило: " + q.explanation;
        expl.style.display = "block";
        
        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData[currentTopic].questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById("quiz-container").style.display = "none";
        document.getElementById("result-container").style.display = "block";
        
        const total = quizData[currentTopic].questions.length;
        const percent = (score / total) * 100;
        
        let xpGained = score * 50; 
        if (percent === 100) xpGained += 50; 
        
        currentUser.xp += xpGained;
        if (!currentUser.completed.includes(currentTopic) && percent >= 50) {
            currentUser.completed.push(currentTopic);
        }
        saveData();
        
        document.getElementById("earned-xp").innerText = xpGained;

        if (percent === 100) {
            document.getElementById("result-title").innerText = "🏆 Идеально!";
            document.getElementById("result-text").innerText = "Ни одной ошибки. Супер!";
            shootBigConfetti();
        } else if (percent >= 50) {
            document.getElementById("result-title").innerText = "😎 Хорошая работа!";
            document.getElementById("result-text").innerText = `Твой результат: ${score} из ${total}.`;
            shootBigConfetti();
        } else {
            document.getElementById("result-title").innerText = "💪 Попробуй ещё раз!";
            document.getElementById("result-text").innerText = `Отвечено правильно: ${score} из ${total}.`;
        }
    }
</script>

</body>
</html>
