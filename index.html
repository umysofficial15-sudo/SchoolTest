<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажёр по русскому языку | Личный кабинет</title>
    <!-- Подключаем библиотеку для салюта (конфетти) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #2c3e50;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            position: relative;
        }
        h1, h2 { text-align: center; color: #1a252f; }
        
        /* Стили для личного кабинета */
        .cabinet {
            background: #eaf2f8;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #3498db;
        }
        .user-info { font-size: 18px; font-weight: bold; }
        .xp-badge {
            background: #f1c40f;
            color: #8e44ad;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .login-screen { text-align: center; padding: 40px 0; }
        .name-input {
            padding: 12px;
            font-size: 18px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            width: 60%;
            margin-bottom: 20px;
        }
        
        /* Кнопки */
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover { background-color: #2980b9; transform: translateY(-2px); }
        .btn-back {
            background-color: #7f8c8d;
            color: white;
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 15px;
            font-size: 14px;
        }
        .btn-back:hover { background-color: #95a5a6; }

        /* Стили меню и квиза */
        .topics-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }
        .topic-btn {
            padding: 20px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            text-align: left;
            box-shadow: 0 4px 6px rgba(46, 204, 113, 0.2);
            transition: all 0.2s;
        }
        .topic-btn:hover { background-color: #27ae60; transform: translateY(-2px); }
        .topic-btn.completed { background-color: #95a5a6; }
        
        .quiz-container, #menu-container { display: none; }
        
        .header-quiz { display: flex; justify-content: center; align-items: center; margin-top: 30px; margin-bottom: 20px; }
        .progress { font-weight: bold; color: #3498db; background: #ebf5fb; padding: 5px 12px; border-radius: 20px; margin-left: 15px; }
        .question { font-size: 20px; margin-bottom: 25px; font-weight: 600; }
        .options { display: grid; gap: 12px; }
        .option-btn {
            padding: 16px 20px; background-color: #f8f9f9; border: 2px solid #bdc3c7; border-radius: 10px;
            cursor: pointer; text-align: left; font-size: 16px; transition: all 0.2s;
        }
        .option-btn:hover:not(:disabled) { background-color: #ecf0f1; border-color: #95a5a6; }
        .correct { background-color: #e8f8f5 !important; border-color: #2ecc71 !important; color: #27ae60; }
        .wrong { background-color: #fdedec !important; border-color: #e74c3c !important; color: #c0392b; }
        
        .next-btn { display: none; margin-top: 25px; width: 100%; background-color: #f39c12; color: white; }
        .next-btn:hover { background-color: #d68910; }
        .explanation { display: none; margin-top: 20px; padding: 16px; background-color: #e8f8f5; border-left: 5px solid #1abc9c; border-radius: 0 8px 8px 0; }
        
        /* Анимация результата */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .result-animated { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Экран входа (Личный кабинет) -->
    <div id="login-container" class="login-screen">
        <h1>👋 Привет! Добро пожаловать в Тренажёр</h1>
        <p>Введи своё имя, чтобы создать личный кабинет и сохранять прогресс:</p>
        <input type="text" id="username-input" class="name-input" placeholder="Твоё имя или никнейм..." maxlength="15">
        <br>
        <button class="btn btn-primary" onclick="login()">Начать обучение ➔</button>
    </div>

    <!-- Главное меню -->
    <div id="menu-container">
        <div class="cabinet">
            <div class="user-info">👤 Ученик: <span id="display-name"></span></div>
            <div class="xp-badge">⭐ Опыт: <span id="display-xp">0</span> XP</div>
        </div>
        
        <h2>Выбери тему для тренировки:</h2>
        <div id="topics-menu" class="topics-menu"></div>
        
        <div style="text-align: center; margin-top: 20px;">
            <button class="btn" style="background: #e74c3c; color: white; padding: 8px 15px;" onclick="logout()">Выйти из профиля</button>
        </div>
    </div>

    <!-- Экран квиза -->
    <div id="quiz-container" class="quiz-container">
        <button class="btn btn-back" onclick="returnToMenu()">⬅ Назад</button>
        <div class="header-quiz">
            <h2 id="topic-title" style="margin:0;"></h2>
            <div id="progress" class="progress"></div>
        </div>
        <div id="question-text" class="question"></div>
        <div id="options-container" class="options"></div>
        <div id="explanation" class="explanation"></div>
        <button id="next-btn" class="btn next-btn" onclick="nextQuestion()">Следующий вопрос ➔</button>
    </div>

    <!-- Экран результатов -->
    <div id="result-container" class="quiz-container result-animated">
        <h2 id="result-title" style="font-size: 32px;"></h2>
        <p id="result-text" style="font-size: 18px; color: #7f8c8d;"></p>
        <div class="xp-badge" style="display: inline-block; font-size: 20px; margin: 20px 0;">+ <span id="earned-xp"></span> XP</div>
        <button class="btn btn-primary" style="display:block; width: 100%; margin-top:20px;" onclick="returnToMenu()">🏠 Вернуться в кабинет</button>
    </div>

</div>

<script>
    // База данных тестов (старые + новые темы)
    const quizData = {
        verbs: {
            title: "🔥 Глагол: спряжения, суффиксы",
            questions: [
                { question: "В каком слове на месте пропуска пишется буква Ю (окончание -ЮТ)?", options: ["Они стро..т дом", "Они бор..тся", "Они завис..т", "Они пил..т"], correct: 1, explanation: "Бороться — на -оть, I спряжение. В 3-ем лице мн. ч. окончания -УТ/-ЮТ." },
                { question: "В каком глаголе пишется буква Я (окончание -ЯТ)?", options: ["Они кле..т", "Снежинки та..т", "Собаки ла..т", "Крестьяне се..т"], correct: 0, explanation: "Клеить — II спряжение (они клеЯТ). Таять, лаять, сеять — I спряжение (таЮТ)." }
            ]
        },
        roots: {
            title: "🌳 Чередующиеся корни",
            questions: [
                { question: "В каком слове пишется буква А?", options: ["К..снуться", "Прик..сновение", "К..сательная", "Неук..снительно"], correct: 2, explanation: "В корне -кас-/-кос- пишется А, если после корня стоит суффикс -А-." },
                { question: "В каком слове пишется И?", options: ["Заб..ру", "Зам..реть", "Заб..рать", "Соб..рут"], correct: 2, explanation: "В корнях -бер-/-бир- пишется И, если за корнем следует суффикс -А- (забИрАть)." }
            ]
        },
        phraseology: {
            title: "🎭 Фразеологизмы (Новое)",
            questions: [
                { question: "Что означает фразеологизм «бить баклуши»?", options: ["Громко стучать", "Тяжело работать", "Бездельничать", "Играть на барабане"], correct: 2, explanation: "Бить баклуши — значит проводить время в праздности, бездельничать." },
                { question: "Найди фразеологизм-синоним к выражению «кот наплакал»:", options: ["Куры не клюют", "С гулькин нос", "Водить за нос", "Спустя рукава"], correct: 1, explanation: "«Кот наплакал» и «с гулькин нос» означают одно и то же — очень мало." },
                { question: "Какое слово пропущено: «Делать из мухи ...»?", options: ["пчелу", "слона", "самолёт", "проблему"], correct: 1, explanation: "Делать из мухи слона — сильно преувеличивать мелкую проблему." }
            ]
        },
        syntax: {
            title: "📝 Синтаксис и пунктуация (Новое)",
            questions: [
                { question: "Нужна ли запятая перед союзом А? «Солнце светило( )а тепла не было.»", options: ["Да, всегда", "Нет, никогда", "Только если это сложное предложение", "Зависит от интонации"], correct: 0, explanation: "Перед противительными союзами (А, НО, ДА в значении НО) запятая ставится всегда." },
                { question: "Найди грамматическую основу в предложении: «В лесу громко пели красивые птицы».", options: ["в лесу пели", "красивые птицы", "пели птицы", "громко пели"], correct: 2, explanation: "Кто? Птицы (подлежащее). Что делали? Пели (сказуемое)." },
                { question: "Как называются члены предложения, отвечающие на один вопрос и относящиеся к одному слову?", options: ["Главные", "Второстепенные", "Однородные", "Сложные"], correct: 2, explanation: "Однородные члены предложения отвечают на один и тот же вопрос и зависят от одного и того же слова." }
            ]
        }
    };

    // Переменные состояния
    let currentUser = { name: "", xp: 0, completed: [] };
    let currentTopic = "";
    let currentQuestionIndex = 0;
    let score = 0;

    // Инициализация при загрузке страницы
    window.onload = () => {
        const savedUser = localStorage.getItem('quizUser');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            showMenu();
        } else {
            document.getElementById("login-container").style.display = "block";
        }
    };

    // Логин (создание кабинета)
    function login() {
        const nameInput = document.getElementById("username-input").value.trim();
        if (nameInput === "") {
            alert("Пожалуйста, введи своё имя!");
            return;
        }
        currentUser = { name: nameInput, xp: 0, completed: [] };
        saveData();
        showMenu();
    }

    // Выход
    function logout() {
        localStorage.removeItem('quizUser');
        location.reload(); // Перезагружаем страницу
    }

    // Сохранение в LocalStorage
    function saveData() {
        localStorage.setItem('quizUser', JSON.stringify(currentUser));
        updateCabinetUI();
    }

    function updateCabinetUI() {
        document.getElementById("display-name").innerText = currentUser.name;
        document.getElementById("display-xp").innerText = currentUser.xp;
    }

    function showMenu() {
        document.getElementById("login-container").style.display = "none";
        document.getElementById("quiz-container").style.display = "none";
        document.getElementById("result-container").style.display = "none";
        document.getElementById("menu-container").style.display = "block";
        
        updateCabinetUI();
        renderMenu();
    }

    function renderMenu() {
        const menuContainer = document.getElementById("topics-menu");
        menuContainer.innerHTML = "";
        
        for (const key in quizData) {
            const btn = document.createElement("button");
            btn.className = "topic-btn";
            
            // Если тема уже пройдена, меняем цвет и добавляем галочку
            if (currentUser.completed.includes(key)) {
                btn.classList.add("completed");
                btn.innerHTML = `✅ ${quizData[key].title}`;
            } else {
                btn.innerHTML = quizData[key].title;
            }
            
            btn.onclick = () => startQuiz(key);
            menuContainer.appendChild(btn);
        }
    }

    function startQuiz(topicKey) {
        currentTopic = topicKey;
        currentQuestionIndex = 0;
        score = 0;
        
        document.getElementById("menu-container").style.display = "none";
        document.getElementById("result-container").style.display = "none";
        document.getElementById("quiz-container").style.display = "block";
        document.getElementById("topic-title").innerText = quizData[topicKey].title;
        
        loadQuestion();
    }

    function returnToMenu() {
        showMenu();
    }

    function loadQuestion() {
        const q = quizData[currentTopic].questions[currentQuestionIndex];
        const total = quizData[currentTopic].questions.length;
        
        document.getElementById("progress").innerText = `Вопрос ${currentQuestionIndex + 1} из ${total}`;
        document.getElementById("question-text").innerText = q.question;
        
        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";
        
        q.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optionsContainer.appendChild(btn);
        });

        document.getElementById("explanation").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
    }

    function checkAnswer(selectedIndex, btnElement) {
        const q = quizData[currentTopic].questions[currentQuestionIndex];
        const buttons = document.querySelectorAll(".option-btn");
        
        buttons.forEach(btn => btn.disabled = true);
        
        if (selectedIndex === q.correct) {
            btnElement.classList.add("correct");
            score++;
        } else {
            btnElement.classList.add("wrong");
            buttons[q.correct].classList.add("correct");
        }

        const expl = document.getElementById("explanation");
        expl.innerText = "💡 Правило: " + q.explanation;
        expl.style.display = "block";
        
        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData[currentTopic].questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    // Запуск салюта (конфетти)
    function shootConfetti() {
        var duration = 3 * 1000;
        var end = Date.now() + duration;

        (function frame() {
            confetti({
                particleCount: 5,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: ['#2ecc71', '#3498db', '#f1c40f']
            });
            confetti({
                particleCount: 5,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: ['#2ecc71', '#3498db', '#f1c40f']
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    }

    function showResults() {
        document.getElementById("quiz-container").style.display = "none";
        document.getElementById("result-container").style.display = "block";
        
        const total = quizData[currentTopic].questions.length;
        const percent = (score / total) * 100;
        
        // Начисление XP (Опыта)
        let xpGained = score * 50; 
        if (percent === 100) xpGained += 100; // Бонус за идеальное прохождение
        
        // Сохраняем прогресс
        currentUser.xp += xpGained;
        if (!currentUser.completed.includes(currentTopic) && percent >= 50) {
            currentUser.completed.push(currentTopic);
        }
        saveData();
        
        document.getElementById("earned-xp").innerText = xpGained;

        let title = "";
        let message = "";

        if (percent === 100) {
            title = "🏆 Идеально!";
            message = `Ты ответил правильно на все ${total} вопросов. Великолепно!`;
            shootConfetti(); // Запускаем конфетти!
        } else if (percent >= 50) {
            title = "😎 Отличная работа!";
            message = `Твой результат: ${score} из ${total}. Продолжай в том же духе.`;
            shootConfetti(); // Конфетти для хорошего результата
        } else {
            title = "💪 Есть куда расти!";
            message = `Твой результат: ${score} из ${total}. Почитай правила и попробуй ещё раз, у тебя всё получится!`;
        }

        document.getElementById("result-title").innerText = title;
        document.getElementById("result-text").innerText = message;
    }
</script>

</body>
</html>
