<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тренажёр | V8.0 - Академия 1-6 класс 🎓</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #2c3e50; margin: 0; padding: 20px; user-select: none; }
        .container { max-width: 900px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
        h1, h2, h3, h4 { text-align: center; color: #1a252f; margin-top: 0;}
        
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Кабинет и Инпуты */
        .cabinet { background: #eaf2f8; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border: 2px solid #3498db; }
        .user-info { font-size: 18px; font-weight: bold; }
        .xp-badge { background: #f1c40f; color: #8e44ad; padding: 8px 15px; border-radius: 20px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .login-screen { text-align: center; padding: 40px 0; }
        .name-input { padding: 12px; font-size: 18px; border: 2px solid #bdc3c7; border-radius: 8px; width: 60%; margin-bottom: 20px; box-sizing: border-box; }
        
        /* Кнопки */
        .btn { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: all 0.2s; box-sizing: border-box; }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover { background-color: #2980b9; transform: translateY(-2px); }
        .btn-back { background-color: #7f8c8d; color: white; position: absolute; top: 20px; left: 20px; padding: 8px 15px; font-size: 14px; z-index: 10;}
        .action-buttons { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 20px; }
        .btn-rulebook { background-color: #9b59b6; color: white; flex: 1; margin: 0;}
        .btn-shop { background-color: #e67e22; color: white; flex: 1; margin: 0;}
        
        /* Подсказки */
        .hints-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-hint-mini { background-color: #f1c40f; color: #fff; padding: 8px 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; flex: 1;}
        .btn-hint-big { background-color: #e74c3c; color: #fff; padding: 8px 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; flex: 1;}
        .btn-hint-mini:disabled, .btn-hint-big:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .hint-box { display: none; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-style: italic; font-weight: 500;}
        .hint-mini-box { background: #fef9e7; color: #d35400; border-left: 4px solid #f1c40f; }
        .hint-big-box { background: #fdedec; color: #c0392b; border-left: 4px solid #e74c3c; }

        .topics-menu { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 30px;}
        .topic-btn { padding: 15px 20px; background-color: #2ecc71; color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 600; text-align: left; box-shadow: 0 4px 6px rgba(46, 204, 113, 0.2); transition: all 0.2s;}
        .topic-btn:hover { background-color: #27ae60; transform: translateX(5px); }
        
        .rule-card { background: #f9fbfd; padding: 20px; border-left: 6px solid #3498db; border-radius: 8px; margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
        
        /* Магазин */
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .pack-item { border: 3px solid #bdc3c7; border-radius: 16px; padding: 20px; text-align: center; background: #fff; position: relative;}
        .pack-name { font-weight: bold; font-size: 22px; color: #2c3e50; margin-bottom: 10px;}
        .mystery-cats { display: flex; justify-content: center; gap: 10px; margin: 15px 0; flex-wrap: wrap;}
        .mystery-cat { width: 50px; height: 50px; background: #34495e; color: #f1c40f; font-size: 24px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-weight: bold; animation: pulse 2s infinite;}
        .btn-buy { background: #2ecc71; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer;}
        .btn-equip { background: #3498db; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer;}
        .pack-item.active-pack { border-color: #f39c12; background: #fffdf5; }

        .quiz-container, #menu-container, #rulebook-container, #shop-container { display: none; }
        
        /* Квиз */
        .quiz-header-wrapper { padding-top: 40px; margin-bottom: 20px; border-bottom: 2px solid #ecf0f1; padding-bottom: 15px;}
        .header-quiz { display: flex; flex-direction: column; gap: 10px;}
        .topic-title { margin: 0; font-size: 20px; text-align: left; color: #2980b9;}
        
        /* LIVE SCORE */
        .live-score-board { display: flex; justify-content: space-between; align-items: center; background: #f8f9f9; padding: 10px 15px; border-radius: 8px; border: 1px solid #bdc3c7;}
        .live-stats { font-weight: bold; font-size: 16px; }
        .streak-indicator { font-weight: bold; color: #e67e22; background: #fdebd0; padding: 5px 12px; border-radius: 20px; display: none; }
        
        .question { font-size: 22px; margin-bottom: 15px; font-weight: 600; }
        .options { display: grid; gap: 12px; }
        .option-btn { padding: 16px 20px; background-color: #f8f9f9; border: 2px solid #bdc3c7; border-radius: 10px; cursor: pointer; text-align: left; font-size: 16px; font-weight: 500; transition: 0.2s;}
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes popPulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }

        .correct { background-color: #e8f8f5 !important; border-color: #2ecc71 !important; color: #27ae60; animation: popPulse 0.4s ease-in-out; }
        .wrong { background-color: #fdedec !important; border-color: #e74c3c !important; color: #c0392b; }
        .next-btn { display: none; margin-top: 25px; width: 100%; background-color: #8e44ad; color: white; padding: 15px;}
        .explanation { display: none; margin-top: 20px; padding: 16px; background-color: #e8f8f5; border-left: 5px solid #1abc9c; border-radius: 8px; }
        .floating-xp { position: absolute; color: #f39c12; font-weight: bold; font-size: 24px; animation: floatUp 1s ease-out forwards; pointer-events: none; z-index: 50;}

        /* ПОПАП СТРАЙКА С КОТОМ */
        .streak-popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 10px 50px rgba(0,0,0,0.6); text-align: center; z-index: 1000; border: 5px solid #f39c12; width: 85%; max-width: 350px; animation: popPulse 0.5s ease-out; }
        .streak-title { color: #f39c12; margin: 0 0 10px 0; font-size: 30px; text-transform: uppercase; animation: popPulse 1s infinite; text-shadow: 2px 2px 0px #000;}
        .meme-generator { position: relative; display: inline-block; width: 100%; }
        .meme-generator img { max-width: 100%; border-radius: 12px; border: 3px dashed #e67e22; width: 100%; aspect-ratio: 1/1; object-fit: cover;}
        .meme-text { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-family: 'Impact', sans-serif; font-size: 36px; color: white; text-transform: uppercase; -webkit-text-stroke: 1.5px black; text-shadow: 2px 2px 0 #000; width: 90%; line-height: 1.1; }

        @media (max-width: 768px) {
            body { padding: 0; background-color: #ffffff; }
            .container { border-radius: 0; padding: 20px 15px; min-height: 100vh; box-shadow: none; }
            .cabinet { flex-direction: column; gap: 12px; }
            .action-buttons { flex-direction: column; }
            .btn-rulebook, .btn-shop { width: 100%; padding: 15px; }
            .quiz-header-wrapper { padding-top: 50px; }
            .live-score-board { flex-direction: column; gap: 10px; align-items: flex-start;}
            .meme-text { font-size: 28px; }
        }
    </style>
</head>
<body>

<div class="container fade-in">
    <!-- Логин -->
    <div id="login-container" class="login-screen">
        <h1>🎓 Академия 1-6 Класс</h1>
        <p>Введи свой никнейм, чтобы начать учиться:</p>
        <input type="text" id="username-input" class="name-input" placeholder="Твой ник..." maxlength="15">
        <br>
        <button class="btn btn-primary" style="width: 100%; max-width: 300px; padding: 15px;" onclick="login()">Залететь ➔</button>
    </div>

    <!-- Главное меню -->
    <div id="menu-container" class="fade-in">
        <div class="cabinet">
            <div class="user-info">👤 Ученик: <span id="display-name"></span></div>
            <div class="xp-badge">⭐ Опыт: <span id="display-xp">0</span> XP</div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-rulebook" onclick="openRulebook()">📖 Справочник Правил (1-6 кл)</button>
            <button class="btn btn-shop" onclick="openShop()">❓ Тайные Паки Котов</button>
        </div>

        <h2 style="color: #2980b9; margin-bottom: 20px; text-align: left;">📚 Выбери тему для тренировки:</h2>
        <div id="menu-topics" class="topics-menu"></div>

        <div style="text-align: center; margin-top: 20px;">
            <button class="btn" style="background: #e74c3c; color: white; padding: 12px; width: 100%; max-width: 300px;" onclick="logout()">Сменить профиль</button>
        </div>
    </div>

    <!-- МАГАЗИН ЛУТБОКСОВ -->
    <div id="shop-container" class="fade-in">
        <button class="btn btn-back" onclick="returnToMenu()">⬅ Назад</button>
        <h2 style="margin-top: 40px; color: #e67e22;">❓ Тайные Паки</h2>
        <div class="xp-badge" style="display: block; width: max-content; margin: 0 auto 20px auto; font-size: 18px;">Твой баланс: <span id="shop-balance">0</span> XP</div>
        <div id="shop-grid" class="shop-grid"></div>
    </div>

    <!-- СПРАВОЧНИК -->
    <div id="rulebook-container" class="fade-in">
        <button class="btn btn-back" onclick="returnToMenu()">⬅ Назад</button>
        <h2 style="margin-top: 40px;">📖 Справочник (1-6 класс)</h2>
        <div id="rulebook-content"></div>
    </div>

    <!-- Квиз -->
    <div id="quiz-container" class="quiz-container fade-in">
        <button class="btn btn-back" onclick="returnToMenu()">⬅ Ливнуть</button>
        
        <div class="quiz-header-wrapper">
            <div class="header-quiz">
                <h3 id="topic-title" class="topic-title"></h3>
                <div class="live-score-board">
                    <div class="live-stats">✅ Верно: <span id="score-correct" style="color:#27ae60;">0</span> | ❌ Ошибок: <span id="score-wrong" style="color:#c0392b;">0</span></div>
                    <span id="streak-indicator" class="streak-indicator">🔥 Страйк: 0</span>
                </div>
                <div style="font-size: 14px; color: #7f8c8d; font-weight:bold;">Вопрос <span id="progress-num"></span> из 10</div>
            </div>
        </div>

        <div id="question-text" class="question"></div>
        
        <!-- ПОДСКАЗКИ -->
        <div class="hints-container">
            <button id="btn-mini-hint" class="btn-hint-mini" onclick="showHint('mini')">🟡 Мини-подсказка</button>
            <button id="btn-big-hint" class="btn-hint-big" onclick="showHint('big')">🔴 Большая подсказка</button>
        </div>
        <div id="hint-mini-box" class="hint-box hint-mini-box"></div>
        <div id="hint-big-box" class="hint-box hint-big-box"></div>

        <div id="options-container" class="options"></div>
        <div id="explanation" class="explanation"></div>
        <button id="next-btn" class="btn next-btn" onclick="nextQuestion()">Некст вопрос ➔</button>
    </div>

    <!-- ПОПАП СТРАЙКА (Коты 100% грузятся!) -->
    <div id="streak-popup" class="streak-popup">
        <h3 class="streak-title" id="streak-title-text">🔥 СТРАЙК! 🔥</h3>
        <div class="meme-generator">
            <img id="streak-cat-img" src="" alt="Секретный кот">
            <div id="streak-cat-text" class="meme-text"></div>
        </div>
    </div>

    <!-- Результат -->
    <div id="result-container" class="quiz-container fade-in" style="text-align:center;">
        <h2 id="result-title" style="font-size: 32px;"></h2>
        <p id="result-text" style="font-size: 18px; color: #7f8c8d;"></p>
        <div class="xp-badge" style="display: inline-block; font-size: 20px; margin: 20px 0;">+ <span id="earned-xp"></span> XP</div>
        <button class="btn btn-primary" style="display:block; width: 100%; margin-top:20px; padding: 15px;" onclick="returnToMenu()">🏠 Вернуться в меню</button>
    </div>
</div>

<script>
    // === АУДИО ===
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'correct') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'win') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }
    }

    // === ТАЙНЫЕ ПАКИ ===
    const shopPacks = [
        { id: 'pack_default', name: 'Базовый Пак', price: 0, count: 1, texts: ['🔥 ХОРОШ! 🔥'], color: 'white' },
        { id: 'pack_sigma', name: 'Сигма Пак', price: 300, count: 3, texts: ['🗿 СИГМА! 🗿', '🔥 БАЗА! 🔥', '💪 ГИГАЧАД! 💪'], color: '#f1c40f' },
        { id: 'pack_brain', name: 'Брейн Пак', price: 700, count: 3, texts: ['🧠 ГЕНИЙ! 🧠', '💡 МОЗГ! 💡', '🌌 IQ 1000! 🌌'], color: '#00d2d3' },
        { id: 'pack_crazy', name: 'Крейзи Пак', price: 1500, count: 4, texts: ['💸 ЧИНАЗЕС! 💸', '🚀 ИМБА! 🚀', '💥 РАЗРЫВ! 💥', '🏆 СЮДААА! 🏆'], color: '#ff6b6b' }
    ];

    // === СПРАВОЧНИК 1-6 КЛАСС ===
    const rulebookContent = `
        <div class="rule-card"><h3>👶 1-2 Класс: Буквосочетания</h3><p>ЖИ и ШИ — пиши с буквой <b>И</b>.<br>ЧА и ЩА — пиши с буквой <b>А</b>.<br>ЧУ и ЩУ — пиши с буквой <b>У</b>.<br>ЧК, ЧН, НЧ, ЩН — пишутся <b>БЕЗ мягкого знака</b> (ручка, ночной).</p></div>
        <div class="rule-card"><h3>👦 3 Класс: Согласные в корне</h3><p><b>Безударные гласные:</b> подбери проверочное слово так, чтобы на эту гласную падало ударение (в<b>о</b>да - в<b>о</b>ды).<br><b>Непроизносимые согласные:</b> подбери слово, где этот звук чётко слышно (со<b>л</b>нце - со<b>л</b>нечный, ужа<b>сн</b>ый - ужа<b>сен</b>).</p></div>
        <div class="rule-card"><h3>🎒 4 Класс: Ъ и Ь знаки</h3><p><b>Разделительный Ъ:</b> пишется ПОСЛЕ приставок на согласную ПЕРЕД буквами Е, Ё, Ю, Я (под<b>ъ</b>езд, объявление).<br><b>Разделительный Ь:</b> пишется В КОРНЕ или перед окончанием ПЕРЕД буквами Е, Ё, Ю, Я, И (в<b>ь</b>юга, вороб<b>ь</b>и).</p></div>
        <div class="rule-card"><h3>📚 5 Класс: ТСЯ и ТЬСЯ, О/Ё после шипящих</h3><p><b>Глаголы:</b> Что дела<b>ть</b>? -> учи<b>ться</b> (есть Ь). Что дела<b>ет</b>? -> учи<b>тся</b> (нет Ь).<br><b>О/Ё после шипящих (Ж, Ш, Ч, Щ):</b> В корне под ударением пишем Ё, если можно подобрать слово с Е (ш<b>ё</b>пот - ш<b>е</b>птать). Если нельзя — пишем О (крыж<b>о</b>вник, ш<b>о</b>колад).</p></div>
        <div class="rule-card"><h3>🎓 6 Класс: Корни, ПРЕ/ПРИ, Спряжения</h3><p><b>ПРЕ/ПРИ:</b> ПРИ- (приближение, неполнота), ПРЕ- (очень, пере-).<br><b>Корни -БЕР-/-БИР-:</b> Пишем И, если дальше суффикс А (заб<b>и</b>р<b>а</b>ть).<br><b>Спряжения:</b> На -ИТЬ = II спряжение (-ат/-ят). Остальные = I спряжение (-ут/-ют). Исключения: гнать, держать... брить, стелить.</p></div>
    `;

    // === БАЗА ТЕСТОВ (1-6 КЛАСС) ===
    const db = {
        grade1: {
            title: "🟢 1-2 Класс: ЖИ-ШИ, ЧА-ЩА, ЧК-ЧН",
            questions: [
                { q: "Как пишется слово Ж..РАФ?", opts: ["Жираф", "Жыраф", "Жераф"], a: 0, h1: "ЖИ-ШИ", h2: "Пиши с буквой И.", expl: "ЖИ и ШИ пишутся с И." },
                { q: "Ч..ЩА леса.", opts: ["Чаща", "Чящя", "Чащя"], a: 0, h1: "ЧА-ЩА", h2: "Пиши с буквой А.", expl: "ЧА и ЩА пишутся с А." },
                { q: "Маленькое Ч..ДОВИЩЕ.", opts: ["Чюдовище", "Чудовище", "Чёдовище"], a: 1, h1: "ЧУ-ЩУ", h2: "Пиши с буквой У.", expl: "ЧУ и ЩУ пишутся с У." },
                { q: "Мамина РУЧ..КА.", opts: ["Ручька", "Ручка", "Ручкя"], a: 1, h1: "ЧК-ЧН", h2: "Пишутся без мягкого знака.", expl: "ЧК пишется без Ь." },
                { q: "Колючий Ш..ПОВНИК.", opts: ["Шиповник", "Шыповник", "Шеповник"], a: 0, h1: "ЖИ-ШИ", h2: "Пиши с буквой И.", expl: "ШИ пишется с И." },
                { q: "Меткая ПРАЩ..", opts: ["Пращя", "Праща", "Пращу"], a: 1, h1: "ЧА-ЩА", h2: "Пиши с буквой А.", expl: "ЩА пишется с А." },
                { q: "Хищная Щ..КА.", opts: ["Щука", "Щюка", "Щока"], a: 0, h1: "ЧУ-ЩУ", h2: "Пиши с буквой У.", expl: "ЩУ пишется с У." },
                { q: "Верный ПОМОЩ..НИК.", opts: ["Помощьник", "Помощник", "Помошник"], a: 1, h1: "ЩН", h2: "Пишется без мягкого знака.", expl: "ЩН пишется без Ь." },
                { q: "Спелая ГРУШ..", opts: ["Груша", "Грушя", "Грушу"], a: 0, h1: "ЧА-ЩА", h2: "После Ш пишем А (как и после Ч,Щ).", expl: "Слово груша пишется с А." },
                { q: "Хитрая МЫШ..", opts: ["Мышы", "Мыши", "Мышши"], a: 1, h1: "ЖИ-ШИ", h2: "Пиши с буквой И.", expl: "ШИ пишется с И." }
            ]
        },
        grade3: {
            title: "🟡 3 Класс: Корни (безударные, непроизносимые)",
            questions: [
                { q: "Холодная В..ДА.", opts: ["Вада", "Вода", "Вуда"], a: 1, h1: "Проверь ударением.", h2: "Проверочное слово: вОды.", expl: "Проверочное слово — вОды." },
                { q: "Светит СОЛ..НЦЕ.", opts: ["Солнце", "Сонце", "Солынце"], a: 0, h1: "Подбери слово, где звук слышно.", h2: "Проверочное слово: соЛнечный.", expl: "Слышим Л в слове соЛнечный." },
                { q: "Ужа..ная погода.", opts: ["Ужасная", "Ужастная", "Ужастнная"], a: 0, h1: "Измени слово (ужас).", h2: "УжаСен — буквы Т нет.", expl: "Ужасен — значит пишем ужаСНый без Т." },

                { q: "Радостный ПРАЗД..НИК.", opts: ["Празник", "Праздник", "Празденник"], a: 1, h1: "Подбери родственное.", h2: "ПразДен.", expl: "Слово-исключение/словарное, пишется с Д." },
                { q: "Вкусная М..РКОВЬ.", opts: ["Марковь", "Морковь", "Мурковь"], a: 1, h1: "Словарное слово.", h2: "Пишется через О.", expl: "Словарное слово, нужно запомнить." },
                { q: "Грус..ный щенок.", opts: ["Грустный", "Грусный", "Грустнный"], a: 0, h1: "От слова 'грусть'.", h2: "Проверочное слово: грусТь.", expl: "Грусть — значит грусТный." },

        grade4: {

                { q: "Зимняя В..ЮГА.", opts: ["Въюга", "Вьюга", "Вюга"], a: 1, h1: "В корне слова.", h2: "В корне перед Ю пишем Ь.", expl: "Ь пишется в корне слова перед Е, Ё, Ю, Я, И." },
                { q: "Громкое ОБ..ЯВЛЕНИЕ.", opts: ["Объявление", "Обьявление", "Обявление"], a: 0, h1: "ОБ- это приставка.", h2: "После приставки пишем Ъ.", expl: "Ъ пишется после приставки ОБ- перед Я." },
                { q: "Колючие БУР..ЯНЫ.", opts: ["Буръяны", "Бурьяны", "Буряны"], a: 1, h1: "В корне слова.", h2: "В корне пишем Ь.", expl: "Ь пишется в корне слова." },
                { q: "Необ..ятный простор.", opts: ["Необъятный", "Необьятный", "Необятный"], a: 0, h1: "Приставка ОБ-.", h2: "Пишем Ъ после ОБ-.", expl: "Ъ пишется после приставки." },
                { q: "Вороб..и чирикают.", opts: ["Воробъи", "Воробьи", "Вороби"], a: 1, h1: "В корне перед И.", h2: "Только Ь пишется перед И.", expl: "Перед И всегда пишется только разделительный Ь." },
                { q: "С..ел яблоко.", opts: ["Съел", "Сьел", "Сел"], a: 0, h1: "Приставка С-.", h2: "После приставки пишем Ъ.", expl: "Ъ после приставки С- перед Е." },
                { q: "Сем..я дома.", opts: ["Семъя", "Семья", "Семя"], a: 1, h1: "В корне слова.", h2: "Пишем Ь.", expl: "В корне перед Я пишем Ь." },
                { q: "Ш..ют платье.", opts: ["Шъют", "Шьют", "Шют"], a: 1, h1: "Корень.", h2: "В корне пишем Ь.", expl: "Разделительный Ь в корне." },
                { q: "Под..езд закрыт.", opts: ["Подъезд", "Подьезд", "Подезд"], a: 0, h1: "Приставка ПОД-.", h2: "После приставки пишем Ъ.", expl: "Ъ после приставки ПОД-." }
            ]
        },
        grade5: {
            title: "🔴 5 Класс: О/Ё после шипящих, ТСЯ/ТЬСЯ",
            questions: [
                { q: "Учиться хорошо — это пригодит..ся.", opts: ["пригодится", "пригодиться"], a: 0, h1: "Задай вопрос.", h2: "Что сделаЕТ? (без Ь).", expl: "Вопрос без Ь, значит пригодится." },
                { q: "Нужно хорошо готовит..ся.", opts: ["готовится", "готовиться"], a: 1, h1: "Задай вопрос.", h2: "Что делаТЬ? (с Ь).", expl: "Вопрос с Ь, значит готовиться." },
                { q: "Громкий Ш..ПОТ.", opts: ["Шопот", "Шёпот"], a: 1, h1: "Проверь словом с Е.", h2: "Проверочное: шЕптать.", expl: "Можно проверить словом 'шептать', пишем Ё." },
                { q: "Вкусный Ш..КОЛАД.", opts: ["Шоколад", "Шёколад"], a: 0, h1: "Словарное слово.", h2: "Это исключение/заимствованное.", expl: "Заимствованное слово, пишем О." },
                { q: "Ч..РНЫЙ кот.", opts: ["Чорный", "Чёрный"], a: 1, h1: "Проверь словом с Е.", h2: "Проверочное: чЕрнеть.", expl: "Проверочное 'чернеть', пишем Ё." },
                { q: "Колючий КРЫЖ..ВНИК.", opts: ["Крыжовник", "Крыжёвник"], a: 0, h1: "Слово-исключение.", h2: "Пишется через О.", expl: "Исключение, пишем О." },
                { q: "Мальчик смеёт..ся.", opts: ["смеется", "смееться"], a: 0, h1: "Задай вопрос.", h2: "Что делаЕТ? (без Ь).", expl: "Смеется (без Ь)." },
                { q: "Пора ложит..ся спать.", opts: ["ложится", "ложиться"], a: 1, h1: "Что делаТЬ?", h2: "Есть Ь в вопросе.", expl: "Ложиться (с Ь)." },
                { q: "Ж..ЛТЫЙ цвет.", opts: ["Жолтый", "Жёлтый"], a: 1, h1: "Проверь словом с Е.", h2: "ЖЕлтеть.", expl: "Проверочное 'желтеть', пишем Ё." },
                { q: "Ш..В на одежде.", opts: ["Шов", "Шёв"], a: 0, h1: "Слово-исключение.", h2: "Пишется через О.", expl: "Исключение, пишем О." }
            ]
        },
        grade6: {
            title: "🟣 6 Класс: Корни, ПРЕ/ПРИ, Спряжения",
            questions: [
                { q: "ПР..ШКОЛЬНЫЙ участок.", opts: ["Пришкольный", "Прешкольный"], a: 0, h1: "Значение: около.", h2: "Около школы = близость.", expl: "ПРИ- в значении пространственной близости." },
                { q: "ПР..МУДРЫЙ старец.", opts: ["Примудрый", "Премудрый"], a: 1, h1: "Значение: очень.", h2: "Очень мудрый.", expl: "ПРЕ- = ОЧЕНЬ." },
                { q: "Соб..ру игрушки.", opts: ["Соберу", "Собиру"], a: 0, h1: "Правило ИА.", h2: "После корня НЕТ суффикса А.", expl: "Нет суффикса А, пишем Е." },
                { q: "Заб..рать брата.", opts: ["Заберать", "Забирать"], a: 1, h1: "Правило ИА.", h2: "После корня ЕСТЬ суффикс А.", expl: "Есть суффикс А, пишем И." },
                { q: "Они пил..т дрова. (Пилить)", opts: ["пилют", "пилят", "пилут"], a: 1, h1: "Определи спряжение.", h2: "Пилить - на -ИТЬ (II спр).", expl: "II спряжение -> окончание -ЯТ." },
                { q: "Они бор..тся. (Бороться)", opts: ["борются", "борятся", "борат"], a: 0, h1: "Спряжение?", h2: "Бороться - на -ОТЬ (I спр).", expl: "I спряжение -> окончание -ЮТ." },
                { q: "ПР..ГРАДИТЬ путь.", opts: ["Приградить", "Преградить"], a: 1, h1: "Равно приставке ПЕРЕ-.", h2: "Перегородить.", expl: "ПРЕ- в значении ПЕРЕ-." },
                { q: "ПР..СЕСТЬ на стул.", opts: ["Присесть", "Пресесть"], a: 0, h1: "Неполное действие.", h2: "Слегка сесть.", expl: "ПРИ- (неполное действие)." },
                { q: "Они дыш..т. (Дышать)", opts: ["дышут", "дышат", "дышят"], a: 1, h1: "Исключение!", h2: "Дышать - искл. II спр.", expl: "Дышать (искл. II спр) -> дышАТ." },
                { q: "К..сательная линия.", opts: ["Касательная", "Косательная"], a: 0, h1: "Правило КАС/КОС.", h2: "После корня ЕСТЬ суффикс А.", expl: "Пишем А, т.к. есть суффикс -А-." }
            ]
        }
    };

    let currentUser = { name: "", xp: 0, ownedPacks: ['pack_default'], activePack: 'pack_default' };
    let currentTopicId = ""; let currentQuestionIndex = 0;
    let scoreCorrect = 0; let scoreWrong = 0;
    let currentStreak = 0; let streakTimeout = null;

    // ГЕНЕРАЦИЯ КОТОВ (LoremFlickr - никаких VPN не нужно, всегда новые)
    function getRandomCatUrl() {
        return `https://loremflickr.com/320/320/cat?lock=${Math.floor(Math.random() * 10000)}`;
    }

    window.onload = () => {
        const saved = localStorage.getItem('superQuizV8_Academy');
        if (saved) { currentUser = Object.assign(currentUser, JSON.parse(saved)); showMenu(); } 
        else { document.getElementById("login-container").style.display = "block"; }
    };

    function login() {
        const name = document.getElementById("username-input").value.trim();
        if (!name) return;
        playSound('correct'); currentUser.name = name; saveData(); showMenu();
    }
    
    function logout() { localStorage.removeItem('superQuizV8_Academy'); location.reload(); }
    function saveData() { localStorage.setItem('superQuizV8_Academy', JSON.stringify(currentUser)); }

    function showMenu() {
        hideAll(); document.getElementById("menu-container").style.display = "block";
        document.getElementById("display-name").innerText = currentUser.name;
        document.getElementById("display-xp").innerText = currentUser.xp;
        renderTopics();
    }

    function hideAll() {
        ['login-container', 'menu-container', 'rulebook-container', 'quiz-container', 'result-container', 'shop-container'].forEach(id => {
            document.getElementById(id).style.display = 'none';
        });
    }

    // === СПРАВОЧНИК И МАГАЗИН ===
    function openRulebook() { playSound('correct'); hideAll(); document.getElementById("rulebook-container").style.display = "block"; document.getElementById("rulebook-content").innerHTML = rulebookContent; }
    function openShop() { playSound('correct'); hideAll(); document.getElementById("shop-container").style.display = "block"; renderShop(); }
    
    function renderShop() {
        document.getElementById("shop-balance").innerText = currentUser.xp;
        const grid = document.getElementById("shop-grid"); grid.innerHTML = "";
        shopPacks.forEach(pack => {
            const div = document.createElement("div"); div.className = "pack-item" + (currentUser.activePack === pack.id ? " active-pack" : "");
            const isOwned = currentUser.ownedPacks.includes(pack.id);
            let btnHtml = currentUser.activePack === pack.id ? `<button class="btn-equip" disabled style="background:#95a5a6;">✅ Пак Активен</button>` : 
                          isOwned ? `<button class="btn-equip" onclick="equipPack('${pack.id}')">Включить Пак</button>` : 
                          `<button class="btn-buy" onclick="buyPack('${pack.id}', ${pack.price})">Купить за ${pack.price} XP</button>`;
            
            let mysteryHtml = '<div class="mystery-cats">';
            for(let i=0; i<pack.count; i++) mysteryHtml += `<div class="mystery-cat">❓</div>`;
            mysteryHtml += '</div>';

            div.innerHTML = `<div class="pack-name">${pack.name}</div>${mysteryHtml}<div class="cat-price">${isOwned ? 'Куплено' : pack.price + ' XP'}</div>${btnHtml}`;
            grid.appendChild(div);
        });
    }

    function buyPack(id, price) {
        if (currentUser.xp >= price) { playSound('buy'); currentUser.xp -= price; currentUser.ownedPacks.push(id); currentUser.activePack = id; saveData(); renderShop(); confetti(); } 
        else { playSound('wrong'); alert("Мало XP! Проходи тесты."); }
    }
    function equipPack(id) { playSound('correct'); currentUser.activePack = id; saveData(); renderShop(); }
    function returnToMenu() { playSound('correct'); showMenu(); }

    // === ЛОГИКА КВИЗА ===
    function renderTopics() {
        const container = document.getElementById("menu-topics"); container.innerHTML = "";
        for (const key in db) {
            const btn = document.createElement("button"); btn.className = "topic-btn"; btn.innerHTML = db[key].title;
            btn.onclick = () => startQuiz(key); container.appendChild(btn);
        }
    }

    function startQuiz(topic) {
        playSound('correct'); currentTopicId = topic; currentQuestionIndex = 0; scoreCorrect = 0; scoreWrong = 0; currentStreak = 0;
        hideAll(); document.getElementById("quiz-container").style.display = "block";
        document.getElementById("topic-title").innerText = db[topic].title;
        updateLiveScore(); loadQuestion();
    }

    function updateLiveScore() {
        document.getElementById("score-correct").innerText = scoreCorrect;
        document.getElementById("score-wrong").innerText = scoreWrong;
        const ind = document.getElementById("streak-indicator");
        if (currentStreak > 0) { ind.style.display = "inline-block"; ind.innerText = `🔥 Страйк: ${currentStreak}`; } else { ind.style.display = "none"; }
    }

    function loadQuestion() {
        const q = db[currentTopicId].questions[currentQuestionIndex];
        document.getElementById("progress-num").innerText = currentQuestionIndex + 1;
        document.getElementById("question-text").innerText = q.q;
        
        // Сброс подсказок
        document.getElementById("btn-mini-hint").disabled = false; document.getElementById("btn-big-hint").disabled = false;
        document.getElementById("hint-mini-box").style.display = "none"; document.getElementById("hint-big-box").style.display = "none";
        
        const optsContainer = document.getElementById("options-container"); optsContainer.innerHTML = "";
        q.opts.forEach((opt, index) => {
            const btn = document.createElement("button"); btn.className = "option-btn"; btn.innerText = opt;
            btn.onclick = (e) => checkAnswer(index, btn, e); optsContainer.appendChild(btn);
        });
        document.getElementById("explanation").style.display = "none"; document.getElementById("next-btn").style.display = "none";
    }

    function showHint(type) {
        playSound('correct');
        const q = db[currentTopicId].questions[currentQuestionIndex];
        if (type === 'mini') {
            document.getElementById("btn-mini-hint").disabled = true;
            document.getElementById("hint-mini-box").innerText = "🟡 " + q.h1;
            document.getElementById("hint-mini-box").style.display = "block";
        } else {
            document.getElementById("btn-big-hint").disabled = true;
            document.getElementById("hint-big-box").innerText = "🔴 " + q.h2;
            document.getElementById("hint-big-box").style.display = "block";
        }
    }

    function createFloatingXP(x, y) {
        const el = document.createElement('div'); el.className = 'floating-xp'; el.innerText = '+20 XP';
        el.style.left = (window.innerWidth < 768 ? x - 30 : x) + 'px'; el.style.top = (window.innerWidth < 768 ? y - 50 : y) + 'px';
        document.body.appendChild(el); setTimeout(() => el.remove(), 1000);
    }

    function checkAnswer(selectedIndex, btnElement, event) {
        const q = db[currentTopicId].questions[currentQuestionIndex];
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach(btn => btn.disabled = true);
        
        if (selectedIndex === q.a) {
            playSound('correct'); btnElement.classList.add("correct");
            scoreCorrect++; currentStreak++; createFloatingXP(event.clientX, event.clientY);
            if (currentStreak === 3) { triggerStreakCat(); currentStreak = 0; }
        } else {
            playSound('wrong'); btnElement.classList.add("wrong"); buttons[q.a].classList.add("correct");
            scoreWrong++; currentStreak = 0;
        }

        updateLiveScore();
        document.getElementById("explanation").innerHTML = `<b>Объяснение:</b> ${q.expl}`;
        document.getElementById("explanation").style.display = "block";
        document.getElementById("next-btn").style.display = "block";
    }

    // === СУПЕР-ФИКС КОТОВ ===
    function triggerStreakCat() {
        playSound('win');
        const popup = document.getElementById("streak-popup");
        const img = document.getElementById("streak-cat-img");
        const textOverlay = document.getElementById("streak-cat-text");
        
        const activePackData = shopPacks.find(p => p.id === currentUser.activePack) || shopPacks[0];
        const randomText = activePackData.texts[Math.floor(Math.random() * activePackData.texts.length)];
        
        // 100% новый случайный кот!
        img.src = getRandomCatUrl();
        textOverlay.innerText = randomText;
        textOverlay.style.color = activePackData.color;
        
        popup.style.display = "block";
        if(streakTimeout) clearTimeout(streakTimeout);
        streakTimeout = setTimeout(() => { popup.style.display = "none"; }, 5000); 
    }

    function nextQuestion() {
        playSound('correct'); document.getElementById("streak-popup").style.display = "none";
        currentQuestionIndex++;
        if (currentQuestionIndex < db[currentTopicId].questions.length) loadQuestion(); else showResults();
    }

    function showResults() {
        hideAll(); document.getElementById("result-container").style.display = "block";
        const total = db[currentTopicId].questions.length;
        const percent = (scoreCorrect / total) * 100;
        let xpGained = scoreCorrect * 20; if (percent === 100) xpGained += 50; 
        
        currentUser.xp += xpGained; saveData();
        document.getElementById("earned-xp").innerText = xpGained;
        
        if (percent === 100) {
            playSound('win'); document.getElementById("result-title").innerText = "🏆 Идеально! Ты просто Гигачад!";
            document.getElementById("result-text").innerText = "10 из 10! Чиназес! 🗿😎"; confetti({ particleCount: 150, spread: 100 });
        } else if (percent >= 50) {
            playSound('win'); document.getElementById("result-title").innerText = "😎 Хорошая работа!";
            document.getElementById("result-text").innerText = `Верно: ${scoreCorrect} из ${total}. Идём дальше! 😼`; confetti({ particleCount: 80, spread: 80 });
        } else {
            playSound('wrong'); document.getElementById("result-title").innerText = "😿 Тильт...";
            document.getElementById("result-text").innerText = `Ошибок: ${scoreWrong}. Читай теорию и пробуй снова! 💪`;
        }
    }
</script>

</body>
